[package]
name = "terra"
version = "0.1.0"
edition = "2021"
description = "A real-time, interactive 3D Earth rendered from Rust + WebGL2"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "=0.2.106"
wasm-bindgen-futures = "=0.4.56"
js-sys = "=0.3.83"
web-sys = { version = "=0.3.83", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "HtmlImageElement",
    "DomTokenList",
    "CssStyleDeclaration",
    "Performance",
    "Navigator",
    "Event",
    "EventTarget",
    "MouseEvent",
    "PointerEvent",
    "WheelEvent",
    "KeyboardEvent",
    "WebGl2RenderingContext",
    "WebGlProgram",
    "WebGlShader",
    "WebGlBuffer",
    "WebGlVertexArrayObject",
    "WebGlTexture",
    "WebGlUniformLocation",
    "NodeList",
    "console",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
